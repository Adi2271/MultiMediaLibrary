<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediaVault{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-brand">MediaVault</a>
        <div class="nav-links">
            <a href="/search">Search</a>
            <a href="/library">Library</a>
            <a href="/timeline">Timeline</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Info Modal -->
<div id="info-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-box">
        <button class="modal-close" onclick="closeInfoModal()">✕</button>

        <div class="modal-inner">
            <div class="modal-left">
                <img id="modal-cover" src="" alt="" class="modal-cover"/>
            </div>

            <div class="modal-right">
                <div class="modal-meta-top">
                    <span id="modal-category" class="category-badge"></span>
                    <span id="modal-year" class="card-meta"></span>
                    <span id="modal-score" class="card-meta"></span>
                    <span id="modal-total" class="card-meta"></span>
                </div>

                <h2 id="modal-title" class="modal-title"></h2>

                <p id="modal-genres" class="card-genres"></p>

                <p id="modal-synopsis" class="modal-synopsis"></p>

                <div class="modal-actions">
                    <a id="modal-ref" href="#" target="_blank"
                       class="ref-link" style="display:none;">
                        View on Source ↗
                    </a>
                    <button id="modal-add-btn" class="btn-primary"
                            onclick="addFromModal()">
                        + Add to Library
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="/static/js/app.js"></script>
</body>
</html>
